services:
  cron:
    image: humblebeeai/sidecar-cron:0.0.0-260101
    build:
      context: .
    restart: always
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - "./volumes/configs/cron/scripts:/app/cron/scripts/custom"
      - "./volumes/configs/cron/cron.d:/app/cron/configs/cron.d"
      - "./volumes/storage/cron/logs:/var/log/cron"
    healthcheck:
      test: "pgrep -x cron || exit 1"
      start_period: 10s
      start_interval: 1s
      interval: 5m
      timeout: 5s
      retries: 3
    tty: true
